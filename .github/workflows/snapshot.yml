name: Copia nocturna de la web
on:
  schedule:
    - cron: '17 3 * * *'     # cada noche (UTC); la petición también evita que Supabase se pause
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guardar copia de los datos públicos
        run: python3 supabase/snapshot.py
      - name: Validar JSON
        run: python3 -m json.tool data/snapshot.json > /dev/null
      - name: Subir si hay cambios
        run: |
          if [ -n "$(git status --porcelain data/snapshot.json)" ]; then
            git config user.name "virand-bot"; git config user.email "actions@users.noreply.github.com"
            git add data/snapshot.json && git commit -m "Copia nocturna de datos" && git push
          fi
